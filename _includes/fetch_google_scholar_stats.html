<script>
  document.addEventListener("DOMContentLoaded", function () {
    var repository = {{ site.repository | jsonify }};
    var branch = "google-scholar-stats";
    var dataPath = "gs_data.json";
    var cacheKey = Math.floor(Date.now() / 3600000);
    var cdnUrl = "https://cdn.jsdelivr.net/gh/" + repository + "@" + branch + "/" + dataPath + "?v=" + cacheKey;
    var rawUrl = "https://raw.githubusercontent.com/" + repository + "/" + branch + "/" + dataPath + "?v=" + cacheKey;
    // Prefer the uncached Raw endpoint so daily updates appear immediately.
    // jsDelivr remains available as a resilient fallback.
    var sources = [rawUrl, cdnUrl];

    function fetchFirstAvailable(urls) {
      return urls.reduce(function (previous, url) {
        return previous.catch(function () {
          return fetch(url, { cache: "no-store" }).then(function (response) {
            if (!response.ok) {
              throw new Error("Scholar data request returned HTTP " + response.status);
            }
            return response.json();
          });
        });
      }, Promise.reject(new Error("No Scholar data source attempted")));
    }

    function normalizeTitle(title) {
      return String(title || "")
        .toLowerCase()
        .normalize("NFKD")
        .replace(/[^a-z0-9]+/g, "")
        .trim();
    }

    fetchFirstAvailable(sources)
      .then(function (data) {
        if (!data || !Number.isFinite(Number(data.citedby)) || !data.publications) {
          throw new Error("Scholar data has an invalid schema");
        }

        var totalCitation = document.getElementById("total_cit");
        if (totalCitation) {
          totalCitation.textContent = Number(data.citedby).toLocaleString();
          if (data.updated) {
            totalCitation.title = "Last updated: " + new Date(data.updated).toLocaleString();
          }
        }

        var publicationsByTitle = {};
        Object.keys(data.publications).forEach(function (paperId) {
          var item = data.publications[paperId];
          var title = item && item.bib && item.bib.title;
          if (title) {
            publicationsByTitle[normalizeTitle(title)] = item;
          }
        });

        document.querySelectorAll(".show_paper_citations").forEach(function (element) {
          var paperId = element.dataset.scholarId;
          var titleKey = normalizeTitle(element.dataset.title);
          var publication = (paperId && data.publications[paperId]) || publicationsByTitle[titleKey];
          if (publication && Number.isFinite(Number(publication.num_citations))) {
            element.textContent = "Citations: " + Number(publication.num_citations).toLocaleString();
            element.hidden = false;
          } else {
            element.hidden = true;
          }
        });
      })
      .catch(function (error) {
        console.warn("Google Scholar citation data is temporarily unavailable.", error);
      });
  });
</script>
