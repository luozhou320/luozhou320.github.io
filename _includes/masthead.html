<header class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Primary navigation">
        <button type="button" aria-label="Toggle navigation" aria-controls="site-nav-overflow" aria-expanded="false"><div class="navicon"></div></button>
        <ul id="site-nav-links" class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item">
            <a class="terminal-brand" href="#about-me" aria-label="Luo Zhou's homepage">
              <span class="terminal-brand__user">luozhou@hkust</span><span aria-hidden="true">:</span><span class="terminal-brand__path">~</span><span aria-hidden="true">$&nbsp;</span><span>./homepage</span><span class="terminal-cursor" aria-hidden="true"></span>
            </a>
          </li>
          {% for link in site.data.navigation.main %}
            {% assign nav_slug = link.title | downcase | replace: ' ', '-' %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}"><span aria-hidden="true">./</span>{{ nav_slug }}<span aria-hidden="true">.md</span></a></li>
          {% endfor %}
        </ul>
        <ul id="site-nav-overflow" class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</header>
